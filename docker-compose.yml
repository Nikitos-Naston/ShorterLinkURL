services:
  postgres:
    image: postgres:18-alpine
    container_name: linkshrink-postgres
    environment:
      POSTGRES_DB: linkshrink
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d linkshrink"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    image: migrate/migrate:v4.19.1
    container_name: linkshrink-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://postgres:postgres@postgres:5432/linkshrink?sslmode=disable
      - up
    restart: "no"

  app:
    build:
      context: .
    container_name: linkshrink-app
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/linkshrink?sslmode=disable
    command: ["-storage", "postgres"]
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data: